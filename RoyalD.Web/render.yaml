services:
  # Web Application Service
  - type: web
    name: royald-debtor-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: DatabaseProvider
        value: PostgreSQL
      - key: USE_POSTGRES
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: royald-postgres
          property: connectionString

databases:
  # High Performance Managed PostgreSQL Database
  - name: royald-postgres
    databaseName: royald_db
    user: royald_admin
    plan: free
    region: singapore
